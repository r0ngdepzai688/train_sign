<svg viewBox="0 0 480 110" width="480" height="110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0FF" />
      <stop offset="100%" stop-color="#0C65FF" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C65FF" />
      <stop offset="100%" stop-color="#1E42A0" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E42A0" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
    <linearGradient id="qTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0FF" />
      <stop offset="100%" stop-color="#0C65FF" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- 3D Cube -->
    <path d="M 36,27 L 46,21.5 L 36,16 L 26,21.5 Z" fill="url(#cubeTop)" stroke="#00E0FF" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 26,21.5 L 36,27 L 36,38 L 26,32.5 Z" fill="url(#cubeLeft)" stroke="#0C65FF" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 36,27 L 46,21.5 L 46,32.5 L 36,38 Z" fill="url(#cubeRight)" stroke="#1E42A0" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Outer Hexagon Frame -->
    <path d="M 36,6 L 56,16 L 56,42 L 36,52 Z" stroke="#0C65FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Silver N (Light silver in Dark Mode) -->
    <path d="M 16,16 L 16,42 L 36,52 L 36,30" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Typography: IQC -->
    <g transform="translate(72, 0)">
      <!-- Letter I -->
      <rect x="0" y="10" width="7" height="28" rx="2.5" fill="#FFFFFF" />
      
      <!-- Letter Q -->
      <path d="M 32,24 C 32,32.5 25.5,39 17,39 C 8.5,39 2,32.5 2,24 C 2,15.5 8.5,9 17,9 C 25.5,9 32,15.5 32,24 Z M 25,24 C 25,19.5 21.4,16 17,16 C 12.6,16 9,19.5 9,24 C 9,28.5 12.6,32 17,32 C 21.4,32 25,28.5 25,24 Z" fill="#FFFFFF" />
      <path d="M 23,29 L 34,41.5 L 26,41.5 L 17,31 Z" fill="url(#qTail)" />
      
      <!-- Letter C -->
      <path d="M 64,15.5 C 62,11.5 57.5,9 52,9 C 43.5,9 37,15.5 37,24 C 37,32.5 43.5,39 52,39 C 57.5,39 62,36.5 64,32.5 L 57.5,32.5 C 56,34 54.5,35 52,35 C 47.5,35 44,30.5 44,24 C 44,17.5 47.5,13 52,13 C 54.5,13 56,14 57.5,15.5 Z" fill="#FFFFFF" />

      <!-- NEXUS text -->
      <text x="0" y="49" fill="#00E0FF" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="900" letter-spacing="0.66em">NEXUS</text>
    </g>

    <!-- Separator Line -->
    <line x1="12" y1="65" x2="450" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- Slogan 1: AI-DRIVEN • QUALITY-FOCUSED • FUTURE-READY -->
    <text x="56" y="80" fill="#E2E8F0" font-family="Space Grotesk, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.25em">AI-DRIVEN • QUALITY-FOCUSED • FUTURE-READY</text>

    <!-- Slogan 2: ENABLING SMART QUALITY, POWERING AI-DRIVEN FUTURE 2030 -->
    <text x="12" y="98" fill="#00E0FF" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="800" letter-spacing="0.18em">ENABLING SMART QUALITY, POWERING AI-DRIVEN FUTURE 2030</text>
  </g>
</svg>
